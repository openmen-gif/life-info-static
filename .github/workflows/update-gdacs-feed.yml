name: Update GDACS Disaster Feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wildfire and typhoon snapshot from GDACS RSS
        run: python scripts/build_gdacs_feed.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gdacs_incidents.json
          git diff --cached --quiet || git commit -m "chore: update GDACS disaster feed [skip ci]"
          git push
